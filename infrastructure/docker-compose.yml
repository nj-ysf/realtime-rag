
services:
  postgres:
    image: postgres:17
    container_name: ecommerce-postgres
    restart: unless-stopped
    # Credentials come from infrastructure/.env (git-ignored); see .env.example.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infrastructure/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infrastructure/.env}
    # Only reachable from this machine. Host port is configurable in .env (POSTGRES_HOST_PORT),
    # e.g. 5433 when a native PostgreSQL already occupies 5432.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: ecommerce-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 10

  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: ecommerce-debezium
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Lets connector.json reference ${env:POSTGRES_PASSWORD} instead of a literal password.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infrastructure/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infrastructure/.env}

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ecommerce-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # RAG API. Opt-in profile, so a plain `docker compose up` does not build or start it:
  #   docker compose --profile api up -d --build rag-api
  # Inside the container "localhost" is the container itself, so other services are
  # reached by service name. Ollama runs on the host (it is not part of this compose file):
  # on the host set OLLAMA_HOST=0.0.0.0 so it accepts connections from containers.
  rag-api:
    profiles: ["api"]
    build:
      context: ..
      dockerfile: rag_api/Dockerfile
    container_name: ecommerce-rag-api
    restart: unless-stopped
    depends_on:
      - postgres
      - qdrant
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infrastructure/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infrastructure/.env}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: products
      # LLM backend. GEMINI_API_KEY comes from infrastructure/.env (git-ignored) or your
      # shell environment (which takes precedence), never written here.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      HF_HOME: /models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf_cache:/models

volumes:
  postgres_data:
  kafka_data:
  qdrant_data:
  hf_cache:
